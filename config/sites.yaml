clients:
  sasol:
    name: Sasol
    parser: sasol
    base_url: https://www.sasol.com   # site-mode root (defaults to list_url if absent)
    list_url: https://www.sasol.com/media-centre/media-releases
    media_source: Sasol Media Centre
    media_source_url: https://www.sasol.com/media-centre/media-releases
    fetch_articles: true      # mixed mode: also pull full article body
    article_delay: 1.0        # seconds between article fetches (politeness)
    limit: 0                  # 0 = no limit (all items)
    # ---- site-mode (full-site structured crawl) options ----
    site_max_pages: 500       # hard cap on pages crawled per run
    site_delay: 0.5           # seconds between page fetches (politeness)
    site_max_depth: 3         # BFS depth when sitemap is thin
    # site_sections:          # optional: map URL first-segment -> friendly name
    #   media-centre: 媒体发布
    #   our-businesses: 业务
    #   investors: 投资者
    #   sustainability: 可持续
    #   who-we-are: 关于我们

  hitachi-hightech:
    name: Hitachi High-Tech
    parser: hitachi
    engine: playwright        # Akamai WAF blocks plain requests; use real browser
    browser_channel: chrome   # drive real Chrome (TLS fingerprint passes Akamai)
    base_url: https://www.hitachi-hightech.com/global/en/   # site-mode root = EN area
    list_url: https://www.hitachi-hightech.com/global/en/news/   # news-mode list (legacy)
    media_source: Hitachi High-Tech
    media_source_url: https://www.hitachi-hightech.com/global/en/news/
    fetch_articles: true
    article_delay: 1.5
    limit: 0
    # ---- site-mode (full English-site structured crawl) options ----
    # Crawl the WHOLE English site (/global/en/*), not just /global/en/news/.
    # Set in sites.yaml as site_path_prefix; site_crawler restricts to this tree.
    site_path_prefix: /global/en
    site_max_pages: 300       # hard cap on pages crawled per run
    site_delay: 0.5           # seconds between page fetches (politeness)
    site_max_depth: 4         # BFS depth when sitemap is thin
